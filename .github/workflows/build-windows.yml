name: Build Windows EXE

on:
  push:
    branches:
      - "**"          # každý push na jakoukoliv větev
  workflow_dispatch:  # nebo ručně přes GitHub UI tlačítkem

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavit Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Nainstalovat závislosti
        run: pip install -r requirements.txt

      - name: Sestavit EXE pomocí PyInstaller
        run: |
          pyinstaller --onefile --windowed `
            --name "AgilaxLogFilter" `
            --add-data "MODEL_Logo_M.png;." `
            --add-data "DejaVuSans.ttf;." `
            --add-data "DejaVuSans-Bold.ttf;." `
            --icon "MODEL_Logo_M.png" `
            agilax_filter.py

      - name: Nahrát EXE jako artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgilaxLogFilter-windows
          path: dist/AgilaxLogFilter.exe
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    # Spustí se jen při tagu — vytvoří GitHub Release s EXE
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Stáhnout artifact
        uses: actions/download-artifact@v4
        with:
          name: AgilaxLogFilter-windows
          path: dist/

      - name: Vytvořit GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AgilaxLogFilter.exe
          generate_release_notes: true
